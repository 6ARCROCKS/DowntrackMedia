<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08284c">
<title>Downtrack Media</title>
<meta name="description" content="NHRA pro, sportsman and bracket racing results with reaction-time, increment and dial-in stats for every class and every racer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Saira:ital,wght@1,700;1,800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a href="/" class="logo" aria-label="Downtrack Media home"><img src="/logo.png" alt="Downtrack Media" width="1000" height="193"></a>
    <nav class="nav" aria-label="Main">
      <a href="/events">Results</a>
      <a href="/classes">Classes</a>
      <a href="/drivers">Racers</a>
    </nav>
  </div>
</header>
<div class="stripes" aria-hidden="true"></div>
<main class="wrap" id="app"><div class="loading">Loading</div></main>
<footer class="footer">
  <div class="wrap">
    <div style="max-width:420px">
      <h3>Get the Monday report</h3>
      <p class="small" style="margin:6px 0 0">The weekend's NHRA results and the numbers behind them, every Monday.</p>
      <form class="signup" id="signup" novalidate>
        <label for="signup-email" class="sr">Email address</label>
        <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email">
        <button class="btn" type="submit">Sign up</button>
        <div class="signup-msg" role="status" style="flex-basis:100%"></div>
      </form>
    </div>
    <div class="small" style="max-width:360px">
      <p style="margin:0">Results from NHRA.com and DragRaceCentral, 2022 to today. Stats refresh nightly.</p>
      <p style="margin:10px 0 0">© <span id="yr"></span> Downtrack Media</p>
    </div>
  </div>
</footer>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
